name: 할인 목록 갱신

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 오전 6시(한국 시간)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch.mjs
      - name: 바뀐 내용이 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "할인 목록 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git push
